name: Verify approved deployment
on:
  push:
    branches: [main]
    paths: ['app/msa/kustomization.yaml', 'deploy/release.json']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: verify-deployment
  cancel-in-progress: true
jobs:
  verify:
    # 이 저장소의 기준은 main입니다. AWS 환경·조회 역할·네트워크 준비 후 ENABLE_DEPLOY_CHECKS를 켭니다.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY_CHECKS == 'true'
    # Protected main; start the ephemeral VPC runner before checks.
    runs-on: [self-hosted, linux, x64, deploy-check]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_CHECK_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '193644343848'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AWS CLI in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.36.45.zip" -o "$RUNNER_TEMP/awscli.zip"
          unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP/awscli-install"
          "$RUNNER_TEMP/awscli-install/aws/install" -i "$RUNNER_TEMP/aws-cli" -b "$RUNNER_TEMP/aws-bin"
          echo "$RUNNER_TEMP/aws-bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: aws eks update-kubeconfig --region ap-northeast-2 --name Final-eks
      - name: Verify version and function
        env:
          REVISION: ${{ github.sha }}
        run: python3 scripts/ops/check_release.py --revision "$REVISION"
      - if: failure()
        run: echo '배포 확인 실패. 이전 정상 release를 확인하고 rollback_release.py로 복구 PR을 작성하세요.' >> "$GITHUB_STEP_SUMMARY"
